<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Connection — Pure Local Share</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0B0F19" />
  
  <!-- Bundled QR Engine & Camera Scanner -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; overflow-x: hidden; }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      width: 100%;
      max-width: 440px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
    }

    /* Radar Pulse Animation */
    .radar-circle {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid var(--primary);
      opacity: 0;
      animation: radar 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    .radar-circle:nth-child(2) { animation-delay: 0.8s; }
    .radar-circle:nth-child(3) { animation-delay: 1.6s; }

    @keyframes radar {
      0% { width: 40px; height: 40px; opacity: 0.8; }
      100% { width: 220px; height: 220px; opacity: 0; }
    }

    /* Modern Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 20px; border-radius: 16px; font-weight: 600; font-size: 14px;
      cursor: pointer; border: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none; width: 100%;
    }
    .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: #fff; box-shadow: 0 8px 20px var(--primary-glow); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary { background: rgba(255, 255, 255, 0.05); color: #cbd5e1; border: 1px solid var(--card-border); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }

    /* Drop Zone */
    .dropzone {
      border: 2px dashed rgba(99, 102, 241, 0.4);
      border-radius: 20px; padding: 32px 16px; text-align: center;
      background: rgba(99, 102, 241, 0.03); cursor: pointer;
      transition: all 0.2s ease;
    }
    .dropzone:hover, .dropzone.active { border-color: var(--primary); background: rgba(99, 102, 241, 0.08); }

    /* Progress Bar */
    .progress-bar-bg { background: rgba(255, 255, 255, 0.08); border-radius: 999px; height: 6px; overflow: hidden; margin-top: 8px; }
    .progress-bar-fill { background: linear-gradient(90deg, #6366f1, #06b6d4); height: 100%; width: 0%; transition: width 0.15s ease; }

    /* Custom Badges */
    .badge { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
    .badge-off { background: rgba(255, 255, 255, 0.05); color: #94a3b8; }
    .badge-on { background: rgba(16, 185, 129, 0.15); color: #34d399; }
  </style>
</head>
<body>

  <div class="glass-card">
    
    <!-- Top Header -->
    <header style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #4338ca); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px var(--primary-glow);">
          <!-- Connection Link SVG Symbol -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
        <div>
          <h1 style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px;">Connection</h1>
          <p style="font-size: 11px; color: #64748b;">Direct Local Wi-Fi Bridge</p>
        </div>
      </div>
      <span id="connStatus" class="badge badge-off">Offline</span>
    </header>

    <!-- STEP 1: INITIAL DISCOVERY STATE -->
    <div id="viewInit" style="text-align: center;">
      <div style="position: relative; height: 160px; display: flex; align-items: center; justify-content: center;">
        <div class="radar-circle"></div>
        <div class="radar-circle"></div>
        <div class="radar-circle"></div>
        <div style="width: 58px; height: 58px; background: rgba(99, 102, 241, 0.12); border: 1px solid rgba(99, 102, 241, 0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 2;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="2"/>
            <path d="M16.2 7.8a6 6 0 0 1 0 8.4"/>
            <path d="M7.8 7.8a6 6 0 0 0 0 8.4"/>
            <path d="M19.1 4.9a10 10 0 0 1 0 14.2"/>
            <path d="M4.9 4.9a10 10 0 0 0 0 14.2"/>
          </svg>
        </div>
      </div>

      <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">
        Connect directly to any device nearby over the same Wi-Fi or mobile hotspot.
      </p>

      <div style="display: flex; gap: 10px;">
        <button onclick="startAsHost()" class="btn btn-primary">
          <span>Create Invite</span>
        </button>
        <button onclick="startAsReceiver()" class="btn btn-secondary">
          <span>Scan Invite</span>
        </button>
      </div>
    </div>

    <!-- STEP 2: HANDSHAKE / QR VIEW -->
    <div id="viewHandshake" style="display: none; text-align: center;">
      <h3 id="handshakeHeading" style="font-size: 14px; font-weight: 600; margin-bottom: 14px; color: #cbd5e1;"></h3>

      <div id="qrBox" style="background: white; padding: 12px; border-radius: 18px; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 16px;">
        <canvas id="qrCanvas"></canvas>
      </div>

      <div id="scannerBox" style="display: none; border-radius: 18px; overflow: hidden; border: 1px solid var(--card-border); margin-bottom: 16px;">
        <div id="cameraPreview" style="width: 100%;"></div>
      </div>

      <button id="btnHostScanAnswer" onclick="hostScansAnswer()" class="btn btn-primary" style="display: none;">
        Scan Receiver's Confirmation QR
      </button>
    </div>

    <!-- STEP 3: CONNECTED / ACTIVE SHARING -->
    <div id="viewTransfer" style="display: none;">
      <div class="dropzone" id="dropArea" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" multiple style="display: none;" onchange="handleFileSelect(this.files)" />
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 10px auto;">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p style="font-size: 14px; font-weight: 600; color: #fff;">Choose or drop files</p>
        <p style="font-size: 11px; color: #64748b; margin-top: 4px;">Unlimited size • High speed direct Wi-Fi</p>
      </div>

      <!-- Live Transfer Progress -->
      <div id="progressContainer" style="display: none; margin-top: 16px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8;">
          <span id="transferFileName" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px;">Sending...</span>
          <span id="transferPercent" style="font-weight: 600; color: #cbd5e1;">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
      </div>

      <!-- Received Files Section -->
      <div style="margin-top: 24px;">
        <h4 style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #64748b; margin-bottom: 12px;">Transferred Media</h4>
        <div id="fileInbox" style="display: flex; flex-direction: column; gap: 8px;">
          <p id="emptyText" style="font-size: 12px; color: #475569; text-align: center; padding: 12px 0;">Ready for files.</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Register PWA Service Worker for Offline Execution
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    // WebRTC & Transfer Core
    const CHUNK_SIZE = 16384; // 16 KB standard chunk
    let pc = new RTCPeerConnection({ iceServers: [] });
    let dataChannel = null;
    let scanner = null;

    // Helper: Prune non-host lines from SDP to keep QR code lightweight & easy to scan
    function pruneSDP(sdp) {
      return sdp.split('\r\n')
        .filter(l => !l.startsWith('a=extmap') && !l.startsWith('a=rtcp') && (!l.startsWith('a=candidate') || l.includes('typ host')))
        .join('\r\n');
    }

    // --- Host Handshake ---
    async function startAsHost() {
      switchView('viewHandshake');
      document.getElementById('handshakeHeading').innerText = "1. Scan this Invite on the other device:";
      
      dataChannel = pc.createDataChannel("fileBridge", { ordered: true });
      setupDataChannel();

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      pc.onicecandidate = (e) => {
        if (!e.candidate) {
          const minimalSDP = pruneSDP(pc.localDescription.sdp);
          const encoded = encodeURIComponent(JSON.stringify({ sdp: minimalSDP, type: 'offer' }));
          document.getElementById('qrBox').style.display = "inline-block";
          QRCode.toCanvas(document.getElementById('qrCanvas'), encoded, { width: 220, margin: 1 });
          document.getElementById('btnHostScanAnswer').style.display = "inline-flex";
        }
      };
    }

    function hostScansAnswer() {
      document.getElementById('qrBox').style.display = "none";
      document.getElementById('btnHostScanAnswer').style.display = "none";
      document.getElementById('handshakeHeading').innerText = "2. Scan the Confirmation code from Phone B:";
      
      startScanner(async (data) => {
        stopScanner();
        const res = JSON.parse(decodeURIComponent(data));
        await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: res.sdp }));
      });
    }

    // --- Receiver Handshake ---
    function startAsReceiver() {
      switchView('viewHandshake');
      document.getElementById('handshakeHeading').innerText = "Scan Device A's Invite Code:";

      pc.ondatachannel = (e) => {
        dataChannel = e.channel;
        setupDataChannel();
      };

      startScanner(async (data) => {
        stopScanner();
        const offer = JSON.parse(decodeURIComponent(data));
        await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: offer.sdp }));

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        pc.onicecandidate = (e) => {
          if (!e.candidate) {
            document.getElementById('handshakeHeading').innerText = "Show this Confirmation code to Device A:";
            const minimalSDP = pruneSDP(pc.localDescription.sdp);
            const encoded = encodeURIComponent(JSON.stringify({ sdp: minimalSDP, type: 'answer' }));
            document.getElementById('qrBox').style.display = "inline-block";
            QRCode.toCanvas(document.getElementById('qrCanvas'), encoded, { width: 220, margin: 1 });
          }
        };
      });
    }

    // --- Camera QR Scanner ---
    function startScanner(onSuccess) {
      document.getElementById('scannerBox').style.display = "block";
      scanner = new Html5Qrcode("cameraPreview");
      scanner.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: 220 },
        (decoded) => onSuccess(decoded)
      ).catch(() => alert("Camera permission required to scan connection handshake."));
    }

    function stopScanner() {
      if (scanner) {
        scanner.stop().then(() => {
          document.getElementById('scannerBox').style.display = "none";
        });
      }
    }

    // --- DataChannel File Transfer Protocol ---
    let incomingFile = null;
    let incomingBytes = 0;
    let fileBuffer = [];

    function setupDataChannel() {
      dataChannel.binaryType = 'arraybuffer';

      dataChannel.onopen = () => {
        const badge = document.getElementById('connStatus');
        badge.innerText = "Connected";
        badge.className = "badge badge-on";
        stopScanner();
        switchView('viewTransfer');
      };

      dataChannel.onmessage = (event) => {
        if (typeof event.data === 'string') {
          // Metadata frame
          incomingFile = JSON.parse(event.data);
          incomingBytes = 0;
          fileBuffer = [];
          showProgress(incomingFile.name, 0);
        } else {
          // Binary chunk frame
          fileBuffer.push(event.data);
          incomingBytes += event.data.byteLength;
          showProgress(incomingFile.name, Math.round((incomingBytes / incomingFile.size) * 100));

          if (incomingBytes >= incomingFile.size) {
            const blob = new Blob(fileBuffer);
            appendFileToInbox(incomingFile.name, incomingFile.size, blob);
            hideProgress();
          }
        }
      };
    }

    // Memory-safe chunking with backpressure buffer monitoring
    function handleFileSelect(files) {
      if (!files.length || !dataChannel || dataChannel.readyState !== 'open') return;

      Array.from(files).forEach(file => {
        dataChannel.send(JSON.stringify({ name: file.name, size: file.size }));
        showProgress(file.name, 0);

        let offset = 0;
        const reader = new FileReader();

        reader.onload = (e) => {
          dataChannel.send(e.target.result);
          offset += e.target.result.byteLength;
          showProgress(file.name, Math.round((offset / file.size) * 100));

          if (offset < file.size) {
            // Check buffer capacity to prevent browser crash
            if (dataChannel.bufferedAmount > 16 * 1024 * 1024) {
              dataChannel.onbufferedamountlow = () => {
                dataChannel.onbufferedamountlow = null;
                sliceAndSend();
              };
            } else {
              sliceAndSend();
            }
          } else {
            hideProgress();
          }
        };

        function sliceAndSend() {
          const slice = file.slice(offset, offset + CHUNK_SIZE);
          reader.readAsArrayBuffer(slice);
        }
        sliceAndSend();
      });
    }

    // --- UI State Helpers ---
    function switchView(viewId) {
      ['viewInit', 'viewHandshake', 'viewTransfer'].forEach(id => {
        document.getElementById(id).style.display = (id === viewId) ? 'block' : 'none';
      });
    }

    function showProgress(name, pct) {
      document.getElementById('progressContainer').style.display = "block";
      document.getElementById('transferFileName').innerText = name;
      document.getElementById('transferPercent').innerText = pct + '%';
      document.getElementById('progressBar').style.width = pct + '%';
    }

    function hideProgress() {
      setTimeout(() => {
        document.getElementById('progressContainer').style.display = "none";
        document.getElementById('progressBar').style.width = '0%';
      }, 700);
    }

    function appendFileToInbox(name, size, blob) {
      document.getElementById('emptyText').style.display = 'none';
      const formattedSize = (size / (1024 * 1024)).toFixed(1) + ' MB';
      const fileUrl = URL.createObjectURL(blob);

      const item = document.createElement('div');
      item.style.cssText = "display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:rgba(255,255,255,0.03); border:1px solid var(--card-border); border-radius:16px;";
      item.innerHTML = `
        <div style="overflow:hidden; margin-right:10px;">
          <p style="font-size:13px; font-weight:600; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">${name}</p>
          <p style="font-size:11px; color:#64748b;">${formattedSize}</p>
        </div>
        <a href="${fileUrl}" download="${name}" class="btn btn-primary" style="width:auto; padding:8px 16px; font-size:12px; border-radius:10px;">Save</a>
      `;
      document.getElementById('fileInbox').prepend(item);
    }
  </script>
</body>
</html>
